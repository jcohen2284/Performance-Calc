<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Page Selector</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body>

    <div id="controls" style="margin-bottom: 20px;">
        <input type="number" id="weightInput" placeholder="Enter Weight">
        <button onclick="handleInputSubmit()">Load Page</button>
    </div>

    <div id="pdf-container">
        <canvas id="pdf-canvas" style="border: 1px solid black;"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
