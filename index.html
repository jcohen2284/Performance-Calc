<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Calc Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7; height: 100%;
        }
        #config-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px; box-sizing: border-box;
        }
        .card {
            background: white; padding: 40px; border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 500px;
        }
        h2, h3 { margin-top: 0; color: #1d1d1f; text-align: center; }
        h3 { font-size: 16px; text-align: left; margin-bottom: 10px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #86868b; }
        input[type="file"] {
            width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 16px; box-sizing: border-box;
        }
        #dynamic-config-area {
            display: none; margin-top: 20px; border-top: 1px solid #e5e5ea; padding-top: 20px;
        }
        .page-exclusion-zone {
            background: #f5f5f7; padding: 15px; border-radius: 8px; max-height: 150px; overflow-y: auto; margin-bottom: 20px;
        }
        .checkbox-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 14px; }
        .checkbox-row input { margin-right: 10px; width: 18px; height: 18px; }
        button {
            width: 100%; padding: 14px; background-color: #007aff; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .load-btn { background-color: #34c759; margin-top: 10px; }
        #status-message {
            margin-top: 15px; padding: 10px; font-size: 14px; text-align: center; border-radius: 6px; background: #f5f5f7; font-weight: 500;
        }
        #display-screen { display: none; flex-direction: column; height: 100vh; background: #3a3a3c; }
        .toolbar { background: #1c1c1e; padding: 15px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .back-btn { background: #3a3a3c; width: auto; padding: 8px 16px; }
        #pdf-container { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
        canvas { background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div id="config-screen">
        <div class="card">
            <h2>Performance Setup</h2>
            
            <div id="upload-stage">
                <div class="input-group">
                    <label>1. Select PDF File</label>
                    <input type="file" id="pdf-file-picker" accept=".pdf">
                </div>
                <button id="manual-load-btn" class="load-btn" onclick="initiatePdfLoad()">Load PDF Document</button>
            </div>

            <div id="dynamic-config-area">
                <h3>2. Hide Pages (Optional)</h3>
                <div class="page-exclusion-zone" id="exclusion-container"></div>

                <button onclick="handleInputSubmit()">Generate Performance Sheet</button>
            </div>
            
            <div id="status-message">Status: Awaiting PDF Selection...</div>
        </div>
    </div>

    <div id="display-screen">
        <div class="toolbar">
            <button class="back-btn" onclick="backToConfig()">← Back to Settings</button>
            <span id="page-indicator" style="font-weight: 600;">Page: --</span>
            <div style="width: 120px;"></div>
        </div>
        
        <div id="pdf-container">
            <canvas id="pdf-canvas"></canvas>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
