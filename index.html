<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Calc Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        /* Global App Styling Optimized for iPad */
        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            height: 100%;
        }

        /* SCREEN 1: Configuration Home Screen (Centered Card style) */
        #config-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
        }

        h2 { margin-top: 0; color: #1d1d1f; text-align: center; }
        
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #86868b;
        }

        input[type="number"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #007aff; /* Apple Blue */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0051a8; }

        /* System Status Ribbon */
        #status-message {
            margin-top: 15px;
            padding: 10px;
            font-size: 14px;
            text-align: center;
            border-radius: 6px;
            background: #f5f5f7;
            font-weight: 500;
        }

        /* SCREEN 2: PDF Display Screen (Initially Hidden) */
        #display-screen {
            display: none; /* Hidden by default */
            flex-direction: column;
            height: 100vh;
            background: #3a3a3c;
        }

        .toolbar {
            background: #1c1c1e;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .back-btn {
            background: #3a3a3c;
            width: auto;
            padding: 8px 16px;
        }

        #pdf-container {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        canvas {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="config-screen">
        <div class="card">
            <h2>Performance Setup</h2>
            
            <div class="input-group">
                <label>1. Select PDF File</label>
                <input type="file" id="pdf-file-picker" accept=".pdf" onchange="loadLocalFile(event)">
            </div>

            <div class="input-group">
                <label>2. Enter Weight (lbs/kg)</label>
                <input type="number" id="weightInput" placeholder="e.g. 75">
            </div>

            <button onclick="handleInputSubmit()">Generate Performance Sheet</button>
            
            <div id="status-message">Status: Awaiting PDF Selection...</div>
        </div>
    </div>


    <div id="display-screen">
        <div class="toolbar">
            <button class="back-btn" onclick="backToConfig()">← Back to Settings</button>
            <span id="page-indicator" style="font-weight: 600;">Page: --</span>
            <div style="width: 120px;"></div> </div>
        
        <div id="pdf-container">
            <canvas id="pdf-canvas"></canvas>
        </div>
    </div>


    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        let loadedPdf = null;

        function updateStatus(text, color = "#007aff") {
            const statusBox = document.getElementById('status-message');
            statusBox.innerText = "Status: " + text;
            statusBox.style.color = color;
        }

        // Handles local file loading via iPad file browser
        function loadLocalFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            updateStatus("Processing file locally...", "#007aff");

            const fileReader = new FileReader();
            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    loadedPdf = pdf;
                    updateStatus("PDF Loaded Successfully! Ready for inputs.", "#34c759");
                }).catch(err => {
                    updateStatus("Error parsing PDF: " + err.message, "#ff3b30");
                });
            };
            fileReader.readAsArrayBuffer(file);
        }

        // Processes home page configurations and decides page visibility
        function handleInputSubmit() {
            const weight = parseFloat(document.getElementById('weightInput').value);
            
            if (!loadedPdf) {
                updateStatus("Please upload a valid PDF file first.", "#ffcc00");
                return;
            }
            if (isNaN(weight)) {
                updateStatus("Please enter a numeric weight value.", "#ffcc00");
                return;
            }

            // Logic mapping ranges to specific target pages
            let targetPage = 1; 
            if (weight < 50) {
                targetPage = 2;
            } else if (weight >= 50 && weight < 100) {
                targetPage = 3;
            } else {
                targetPage = 4;
            }

            // Transition: Hide config page and render screen
            document.getElementById('config-screen').style.display = 'none';
            document.getElementById('display-screen').style.display = 'flex';
            
            renderSpecificPage(targetPage);
        }

        // Renders the chosen single page inside the viewing screen
        function renderSpecificPage(pageNumber) {
            document.getElementById('page-indicator').innerText = "Displaying Page: " + pageNumber;

            loadedPdf.getPage(pageNumber).then(page => {
                const canvas = document.getElementById('pdf-canvas');
                const context = canvas.getContext('2d');
                
                // 1.5 - 2.0 scale factors are crisp on high-res iPad retina displays
                const scale = 1.5; 
                const viewport = page.getViewport({ scale: scale });

                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                page.render(renderContext);
            });
        }

        // Simple function to navigate backward
        function backToConfig() {
            document.getElementById('display-screen').style.display = 'none';
            document.getElementById('config-screen').style.display = 'flex';
            updateStatus("PDF still in memory. Adjust inputs and re-submit.", "#34c759");
        }
    </script>
</body>
</html>
